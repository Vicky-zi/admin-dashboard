name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 取得 GitHub Repository 的程式碼
      - name: Checkout
        uses: actions/checkout@v4

      # 安裝 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 安裝套件
      - name: Install dependencies
        run: npm ci

      # 建立 production 版本
      - name: Build
        run: npm run build

      # 設定 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上傳 dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 部署到 GitHub Pages
      - name: Deploy
        uses: actions/deploy-pages@v4
